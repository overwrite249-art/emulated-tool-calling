name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source
        run: python -m compileall -q emutools tests scripts
      - name: Regression and real-socket tests
        run: python -m unittest discover -s tests -v
      - name: Built-in 200-check suite
        run: python -m emutools --selftest
      - name: Build and test standalone distribution
        run: |
          python build_single_file.py "$RUNNER_TEMP/emutools.py"
          python "$RUNNER_TEMP/emutools.py" --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: emutools-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/emutools.py
          if-no-files-found: error

  real-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        client: [claude, opencode]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned official CLI binary
        env:
          CLIENT: ${{ matrix.client }}
        run: |
          mkdir -p "$RUNNER_TEMP/cli"
          if [ "$CLIENT" = claude ]; then
            URL='https://registry.npmjs.org/@anthropic-ai/claude-code-linux-x64/-/claude-code-linux-x64-2.1.261.tgz'
            BIN="$RUNNER_TEMP/cli/package/claude"
          else
            URL='https://registry.npmjs.org/opencode-linux-x64-baseline/-/opencode-linux-x64-baseline-1.18.29.tgz'
            BIN="$RUNNER_TEMP/cli/package/bin/opencode"
          fi
          curl --fail --silent --show-error --location "$URL" | tar xz -C "$RUNNER_TEMP/cli"
          echo "CLI_BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN" --version
      - name: Real CLI and MCP tools against deterministic model
        env:
          CLIENT: ${{ matrix.client }}
        run: |
          python scripts/live_cli_smoke.py --client "$CLIENT" --cli "$CLI_BIN" \
            --out-dir "$RUNNER_TEMP/cli-smoke" --mock-upstream --timeout 120
      - name: Diagnostics
        if: always()
        run: |
          for file in result.json client.stderr proxy.log; do
            if [ -f "$RUNNER_TEMP/cli-smoke/$file" ]; then cat "$RUNNER_TEMP/cli-smoke/$file"; fi
          done
          if [ -f "$RUNNER_TEMP/cli-smoke/client.jsonl" ]; then tail -n 15 "$RUNNER_TEMP/cli-smoke/client.jsonl"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-smoke-${{ matrix.client }}
          path: |
            ${{ runner.temp }}/cli-smoke/result.json
            ${{ runner.temp }}/cli-smoke/client.stderr
            ${{ runner.temp }}/cli-smoke/proxy.log
            ${{ runner.temp }}/cli-smoke/fixture/greeting.py
          if-no-files-found: warn
